name: Warm cache
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to warm'
        default: 'https://trailmatesadventures.com'
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug first request
        env:
          SITE: ${{ github.event.inputs.site || 'https://trailmatesadventures.com' }}
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
          echo "Requesting $SITE/"
          curl -sS -o /dev/null -D - -A "$UA" -H "Accept: text/html" "$SITE/" | head -25 || true
          echo "----- sitemap"
          curl -sS -o /dev/null -D - -A "$UA" "$SITE/sitemap_index.xml" | head -12 || true
      - name: Warm pages
        env:
          SITE: ${{ github.event.inputs.site || 'https://trailmatesadventures.com' }}
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
          urls="$SITE/"
          for m in $(curl -sS -A "$UA" "$SITE/sitemap_index.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g'); do
            urls="$urls $(curl -sS -A "$UA" "$m" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep -v -E '\.(jpg|jpeg|png|webp|gif)$' | grep -v -E 'cart|checkout|my-account|wishlist')"
          done
          echo "$urls" | tr ' ' '\n' | sort -u | grep -v '^$' | head -150 > urls.txt
          echo "URLs found: $(wc -l < urls.txt)"
          while read -r u; do
            out=$(curl -sS -o /dev/null -D - -A "$UA" -H "Accept: text/html" "$u" 2>&1 | tr -d '\r')
            code=$(echo "$out" | awk '/^HTTP/{print $2; exit}')
            cache=$(echo "$out" | awk 'tolower($1)=="x-scout-cache:"{print $2}')
            echo "${code:-NO-RESPONSE} ${cache:--} $u"
            sleep 0.5
          done < urls.txt
